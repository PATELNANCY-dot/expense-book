<div class="container-fluid page d-flex align-items-center justify-content-center">

  <div class="card shadow-lg p-4 login-card">

    <div class="text-center mb-3">
      <h2 class="fw-bold">
        <i class="bi bi-wallet2"></i> Expense Book
      </h2>
      <p class="text-muted">Login to manage your expenses</p>
    </div>

    <form  class="form"  (ngSubmit)="login()">

      <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email"
                 class="form-control"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="Enter email" />
        </div>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">Password</label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Enter password" />

          <span class="input-group-text eye-btn" (click)="togglePassword()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>

    </form>

    <div class="text-center mt-3">
      <small>
        Don't have an account?
        <a routerLink="/register" class="text-decoration-none text-success fw-bold">Register</a>
      </small>
    </div>

  </div>

</div>
