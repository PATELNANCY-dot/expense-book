<div class="page">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4 form-card">

      <div class="text-center mb-3">
        <h2 class="fw-bold">➕ Add Expense</h2>
        <p class="text-muted">Fill the details to add a new expense</p>
      </div>

      <form (ngSubmit)="addExpense()">

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control"
                 [(ngModel)]="expense.title"
                 name="title" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select"
                  [(ngModel)]="expense.category"
                  name="category" required>
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Clothings</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Health</option>
            <option>Entertainment</option>
            <option>Education</option>
            <option>Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Amount</label>
          <input type="number" class="form-control"
                 [(ngModel)]="expense.amount"
                 name="amount" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea class="form-control"
                    rows="3"
                    [(ngModel)]="expense.notes"
                    name="notes"
                    placeholder="Optional description...">
          </textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control"
                 [(ngModel)]="expense.expenseDate"
                 name="date" required />
        </div>

        <button type="submit" class="btn btn-success w-100">
          Add Expense
        </button>

      </form>

      <div class="text-center mt-3">
        <button class="btn btn-outline-primary btn-sm" routerLink="/home">
          ← Back to Home
        </button>
      </div>

    </div>

  </div>
</div>
