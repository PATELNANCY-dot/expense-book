<div class="container-fluid page d-flex align-items-center justify-content-center">

  <div class="card shadow-lg p-4 forgot-card">

    <!-- BACK BUTTON -->

    <div class="back-btn mb-2">
      <a routerLink="/login" class="back-link">
        <i class="bi bi-arrow-left"></i>
      </a>
    </div>

    <br />

    <!-- TITLE -->

    <div class="text-center mb-4">

      <h2 class="fw-bold">
        <i class="bi bi-shield-lock"></i>
        Forgot Password
      </h2>

      <p class="text-muted">
        Reset your account password securely
      </p>


    </div>

    <!-- STEP 1 -->
    @if(step === 1){

    <div>

      <div class="mb-3">

        <label class="form-label">
          Email
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input type="email"
                 class="form-control"
                 [(ngModel)]="email"
                 placeholder="Enter your email">

        </div>

      </div>

      <!-- SEND OTP BUTTON -->

      <button class="btn btn-success w-100 otp-btn"
              (click)="sendOtp()"
              [disabled]="isSendingOtp">

        @if(isSendingOtp){

        <span class="spinner-border spinner-border-sm me-2"></span>
        Sending OTP...

        } @else {

        Send OTP

        }

      </button>

    </div>

    }

    <!-- STEP 2 -->
    @if(step === 2){

    <div>

      <div class="mb-3">

        <label class="form-label">
          OTP
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-key"></i>
          </span>

          <input type="text"
                 class="form-control"
                 [(ngModel)]="otp"
                 placeholder="Enter OTP">

        </div>

      </div>

      <!-- VERIFY OTP BUTTON -->

      <button class="btn btn-success w-100 otp-btn"
              (click)="verifyOtp()"
              [disabled]="isVerifyingOtp">

        @if(isVerifyingOtp){

        <span class="spinner-border spinner-border-sm me-2"></span>
        Verifying OTP...

        } @else {

        Verify OTP

        }

      </button>

      <div class="text-center mt-3">

       

        <!-- RESEND OTP -->

        <div class="text-center mt-3">

          <span class="text-muted">
            Didn't receive OTP?
          </span>

          <button class="btn btn-link resend-btn"
                  (click)="resendOtp()"
                  [disabled]="isResendingOtp">

            @if(isResendingOtp){

            <span class="spinner-border spinner-border-sm me-1"></span>
            Resending...

            } @else {

            Resend OTP

            }

          </button>

        </div>

      </div>

    </div>

    }

    <!-- STEP 3 -->
    @if(step === 3){

    <div>

      <div class="mb-3">

        <label class="form-label">
          New Password
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control"
                 [(ngModel)]="password"
                 placeholder="Enter new password">

          <span class="input-group-text eye-btn"
                (click)="togglePassword()">

            <i class="bi"
               [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
            </i>

          </span>

        </div>

      </div>

      <div class="mb-3">

        <label class="form-label">
          Confirm Password
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-lock-fill"></i>
          </span>

          <input [type]="showConfirmPassword ? 'text' : 'password'"
                 class="form-control"
                 [(ngModel)]="confirmPassword"
                 placeholder="Confirm password">

          <span class="input-group-text eye-btn"
                (click)="toggleConfirmPassword()">

            <i class="bi"
               [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'">
            </i>

          </span>

        </div>

      </div>

      <button class="btn btn-success w-100"
              (click)="resetPassword()">

        Reset Password

      </button>

    </div>

    }

  </div>

</div>
