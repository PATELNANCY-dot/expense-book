<div class="container-fluid page d-flex align-items-center justify-content-center">

  <div class="card shadow-lg p-4 register-card">

    <div class="text-center mb-3">
      <h2 class="fw-bold text-success">
        <i class="bi bi-wallet2"></i> Expense Book
      </h2>


      <p class="text-muted">Register to start tracking expenses</p>
    </div>

    <form (ngSubmit)="register()">

      <!-- Name -->
      <div class="mb-3 text-start">
        <label class="form-label">Name</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" class="form-control"
                 [(ngModel)]="name"
                 name="name"
                 placeholder="Enter name" />
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="Enter email" />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Create password" />
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3 text-start">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-shield-lock"></i>
          </span>
          <input type="password" class="form-control"
                 [(ngModel)]="confirmPassword"
                 name="confirmPassword"
                 placeholder="Confirm password" />
        </div>
      </div>

      <!-- FIXED BUTTON (green like login) -->
      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-person-plus"></i> Register
      </button>

    </form>

    <div class="text-center mt-3">
      <small>
        Already have an account?
        <a routerLink="/login" class="text-decoration-none text-success fw-bold">
          Login
        </a>
      </small>
    </div>

  </div>

</div>
